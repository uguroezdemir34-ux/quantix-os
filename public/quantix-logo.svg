<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="QUANTIX Logo">
  <!--
    QUANTIX placeholder logo.
    3 katman: gümüş boğa silüeti + mavi devre desen + turuncu kristal aksan.
    Kullanıcı kendi profesyonel logo ile değiştirebilir.
  -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="50%" stop-color="#C0C5CC"/>
      <stop offset="100%" stop-color="#8A8F96"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
  </defs>

  <!-- Circuit desen arka plan (mavi) -->
  <g stroke="#1E40AF" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 20 100 L 50 100 L 50 80 L 80 80"/>
    <path d="M 180 100 L 150 100 L 150 80 L 120 80"/>
    <path d="M 100 180 L 100 150 L 80 150 L 80 120"/>
    <path d="M 100 20 L 100 50 L 120 50 L 120 80"/>
    <circle cx="50" cy="100" r="3" fill="#3B82F6"/>
    <circle cx="150" cy="100" r="3" fill="#3B82F6"/>
    <circle cx="100" cy="150" r="3" fill="#3B82F6"/>
    <circle cx="100" cy="50" r="3" fill="#3B82F6"/>
  </g>

  <!-- Boğa silüeti (basitleştirilmiş, head-on view) -->
  <g fill="url(#silver)" stroke="#8A8F96" stroke-width="1">
    <!-- Boynuzlar -->
    <path d="M 70 70 Q 60 50 75 45 Q 80 55 80 70 Z"/>
    <path d="M 130 70 Q 140 50 125 45 Q 120 55 120 70 Z"/>
    <!-- Baş + yüz -->
    <ellipse cx="100" cy="100" rx="35" ry="30"/>
    <!-- Burun -->
    <ellipse cx="100" cy="120" rx="15" ry="10" fill="#8A8F96"/>
    <!-- Gözler -->
    <circle cx="88" cy="95" r="3" fill="#0A0A0A"/>
    <circle cx="112" cy="95" r="3" fill="#0A0A0A"/>
    <!-- Burun delikleri -->
    <ellipse cx="95" cy="122" rx="2" ry="3" fill="#0A0A0A"/>
    <ellipse cx="105" cy="122" rx="2" ry="3" fill="#0A0A0A"/>
  </g>

  <!-- Kristal aksan (turuncu, boynuzlar arası) -->
  <g fill="url(#crystal)">
    <polygon points="100,55 95,72 105,72" />
    <polygon points="100,72 92,80 100,90 108,80" opacity="0.85"/>
  </g>
</svg>
